<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>

    <link
    rel="stylesheet"
    href="rock-paper-scissors-5.css">
  </head>

  <body>
    <p class=" title"> Rock Paper Scissors</p>
    <button onclick="
      
      playGame('Rock');"
      class="move-button"
><img src="images/rock-emoji.png" class="move-icon"></button>

    <button onclick="

      playGame('Paper');

    " class="move-button"
    ><img src="images/paper-emoji.png" class="move-icon"></button>
    <button onclick="
      playGame('Scissors');
    " class="move-button"
    ><img src="images/scissors-emoji.png" class="move-icon"></button>

    <p class="js-result"></p>

    <p class="js-moves"></p>

    <p class="js-score"></p>

    <button onclick="
    score.wins = 0;
    score.loss = 0;
    score.draw = 0;
    localStorage.removeItem('score');
    updateScoreElement();
    ">Reset Score
    </button>
    <script src="rock-paper-scissors-5.js"></script>
  </body>
</html>
