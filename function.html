<!DOCTYPE html>
<html>
  <head>
    <title>
      Functions
    </title>
  </head>
  <body>
    <script>
      function greet(name){
        if(name == undefined){
          console.log('Hi there!');
        }
        else{
          console.log(`Hello ${name}`);
        }
      }
      greet('ayush farmer chudakkar');
    </script>
    </body>
</html>
