<!DOCTYPE html>
<html>
  <head>
    <title>DOM projects</title>

    <style>
      .subscribe-button{
        background-color:black;
        border: none;
        font-size: 22px;
        color: white;
        padding-left: 20px;
        padding-right: 20px;
        padding-top: 8px;
        padding-bottom: 8px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: bold;
        margin-bottom: 20px;
      }
      .is-subscribed{
        background-color:rgb(214, 214, 214);
        color:black;
      }
      body{
        font-family: Arial;
      }
      .cost-input{
        font-size: 20px;
        padding: 8px;
      }
      .button-calculate{
        font-size: 20px;
        padding: 10px;
        color: white;
        background-color: green;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p style="font-size: 25px;">Youtube Subscribe Button</p>
    <button onclick="
    subscribe();
    " class="js-subscribe-button subscribe-button">Subscribe</button>

    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping</p>
    <p>Orders over $40 = FREE shipping</p>

    
    <input placeholder="Cost of order" class="js-cost-input cost-input"
    onkeydown=" handleCostKeydown(event);
      ">

    <button onclick="
    calculateTotal();
    " class="button-calculate">Calculate</button>

    <p class="js-total-cost"></p>

    <script>

      function handleCostKeydown(event){
        if(event.key === 'Enter'){
          calculateTotal();
        }   
      }

      function calculateTotal(){
        const inputElement = document.querySelector('.js-cost-input');
        let cost = Number(inputElement.value);

        if(cost < 40){
          cost = cost + 10;
        }

        document.querySelector('.js-total-cost').innerHTML = `$${cost}`;
      }

      function subscribe(){
        const buttonElement =document.querySelector('.js-subscribe-button');

          if(buttonElement.innerHTML === 'Subscribe'){
            buttonElement.innerHTML = 'Subscribed';
            buttonElement.classList.add('is-subscribed');
          }
          else{
            buttonElement.innerHTML = 'Subscribe';
            buttonElement.classList.remove('is-subscribed');
          }
        }
    </script>
  </body>
</html>
